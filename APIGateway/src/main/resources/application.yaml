spring:
  application:
    name: APIGateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: backend
              uri: "http://backend:8080"
              predicates:
                - Path=/backend/**
              filters:
                - StripPrefix=2

            - id: auth-service
              uri: "http://auth-service:8080"
              predicates:
                - Path=/auth/**

            - id: game-service
              uri: "http://game-service:8080"
              predicates:
                - Path=/poker/**

            - id: user-service
              uri: "http://user-service:8080"
              predicates:
                - Path=/user/**



management:
  endpoints:
    web:
      exposure:
        include: gateway



auth:
  secret-key: ${SECRET_KEY}
  exp: ${EXP}
  iss: ${iss}
  aud: ${aud}