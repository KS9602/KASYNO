spring:
  application:
    name: APIGateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: "http://auth-service:8080"
              predicates:
                - Path=/api/auth/**

            - id: game-service
              uri: "http://game-service:8080"
              predicates:
                - Path=/api/poker/**

            - id: user-service
              uri: "http://user-service:8080"
              predicates:
                - Path=/api/user/**


management:
  endpoints:
    web:
      exposure:
        include: gateway



auth:
  secret-key: ${SECRET_KEY}
  exp: ${EXP}
  iss: ${iss}
  aud: ${aud}