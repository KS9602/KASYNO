<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Webpage</title>
<!--    <link th:href="@{/static/css/index.css}" rel="stylesheet" >-->

</head>
<body style="background-color: lightgray;">
<h1>Welcome to Spring Boot!</h1>
<p>This is a simple HTML webpage served by Spring Boot.</p>
<form id="formik">
    <label for="firstName">First name:</label><br>
    <input type="text" id="firstName" name="firstName"><br>
    <label for="lastName">Last name:</label><br>
    <input type="text" id="lastName" name="lastName">
    <input type="submit" value="Send Request" />
</form>


<!--    <script src="../static/js/index.js">-->
    <script>


        const form = document.querySelector("#formik");

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            sendData()
        })

        async function sendData(){
            const formData = new FormData(form)
            var object = {};
            formData.forEach((value, key) => object[key] = value);
            var json = JSON.stringify(object);
            try{
                const response = await fetch("http://localhost:7777/asd/formkikPost",{
                method: "POST",
                headers:{
        'Content-Type': 'application/json'
        },
                body: json,
                });
                console.log(await response.json())
            }
            catch(e){
                console.error(e)
            }
        }

    </script>
</body>
</html>
